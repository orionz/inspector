name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The inspector builds against automerge from source; override with a
  # repository variable to track a different branch or commit.
  AUTOMERGE_REF: ${{ vars.AUTOMERGE_REF || 'hashless' }}
  WASM_BINDGEN_VERSION: 0.2.127
  BINARYEN_VERSION: version_123

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: automerge-inspector
      - uses: actions/checkout@v4
        with:
          repository: automerge/automerge
          ref: ${{ env.AUTOMERGE_REF }}
          path: automerge

      - name: Install Rust toolchain
        working-directory: automerge-inspector
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: automerge-inspector

      - name: Install wasm-bindgen CLI
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$WASM_BINDGEN_VERSION"; then
            cargo install --locked wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION"
          fi

      - name: Install wasm-opt
        run: |
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz" | tar xz
          echo "$PWD/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Test
        working-directory: automerge-inspector
        run: cargo test -p am-inspect --release

      - name: Build site
        working-directory: automerge-inspector
        run: ./build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: automerge-inspector/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
