<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Automerge Inspector</title>
  <meta name="description" content="Inspect automerge files: chunks, columns, storage cost, and document history.">
  <meta name="theme-color" content="#1b1f2a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=__VERSION__">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 32 32">
      <path d="M16 2 28.1 9v14L16 30 3.9 23V9z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <rect x="9.5" y="12" width="3" height="10" rx="1" fill="currentColor"/>
      <rect x="14.5" y="9" width="3" height="13" rx="1" fill="currentColor" opacity=".75"/>
      <rect x="19.5" y="15" width="3" height="7" rx="1" fill="currentColor" opacity=".5"/>
    </symbol>
  </svg>
  <noscript>This app needs JavaScript and WebAssembly.</noscript>
  <script type="module">
    import init from './pkg/automerge-inspector.js?v=__VERSION__';
    init({ module_or_path: './pkg/automerge-inspector_bg.wasm?v=__VERSION__' });
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
