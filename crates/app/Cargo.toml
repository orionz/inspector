[package]
name = "app"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "automerge-inspector"
path = "src/main.rs"

[dependencies]
am-inspect = { path = "../core", features = ["wasm"] }
automerge = { workspace = true }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["File", "FileList", "Blob", "DragEvent", "DataTransfer", "HtmlInputElement", "Window", "Navigator", "ServiceWorkerContainer", "Location", "Response", "Request"] }
